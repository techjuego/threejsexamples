<div class="three-container">



  <div class="context-menu" *ngIf="showContextMenu" [style.left.px]="contextMenuX" [style.top.px]="contextMenuY">
    <div class="menu-item delete" (click)="deleteSelectedObject()">
      <span class="icon">🗑️</span> Delete Object
    </div>
  </div>

  <div id="app" class="main-scene" #rendererContainer>
  </div>

  <div class="controls-toolbar">
    <button (click)="toggleGrid()" [class.active]="gridVisible" title="Toggle Grid">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 3h18v18H3zM9 3v18M15 3v18M3 9h18M3 15h18" />
      </svg>
    </button>

    <div class="divider"></div>
    <button (click)="toggleSnap()" [class.active]="snapEnabled" title="Toggle Snap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 4h4v4H4zM16 4h4v4h-4zM4 16h4v4H4zM16 16h4v4h-4zM8 6h8M6 8v8M18 8v8M8 18h8" />
      </svg>
    </button>
  </div>

  <div id="cube-scene" class="cube-scene" #cubeSceneContainer></div>
</div>
